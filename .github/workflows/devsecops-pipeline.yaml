name: DevSecOps ML Pipeline

on:
  push:
    branches: [prod, main]
  pull_request:
    branches: [prod, main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: devsecops-mlops/housing-api
  EKS_CLUSTER_NAME: devsecops-mlops-cluster
  S3_BUCKET: devsecops-mlops-artifacts-760829799650

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  # ============================================
  # STAGE 1: CODE SECURITY SCANNING
  # ============================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create reports directory
        run: mkdir -p reports

      - name: Install security tools
        run: |
          pip install bandit pip-audit
          pip install 'safety<3.0.0'  # Use older version compatible with the scan

      # --- Bandit: Python Static Security Analysis ---
      - name: Run Bandit (SAST)
        run: |
          echo "=== BANDIT SECURITY SCAN ==="
          bandit -r src/ -f json -o reports/bandit-report.json || true
          bandit -r src/ -f txt -o reports/bandit-report.txt || true
          bandit -r src/ --severity-level medium
        continue-on-error: true

      # --- pip-audit: Dependency Vulnerability Scan ---
      - name: Run pip-audit (Dependency Scan)
        run: |
          echo "=== DEPENDENCY VULNERABILITY SCAN ==="
          pip install -r requirements.txt
          pip-audit --format json --output reports/pip-audit-report.json || true
          pip-audit || true
        continue-on-error: true

      # --- Safety: Additional Dependency Check ---
      - name: Run Safety Check
        run: |
          echo "=== SAFETY DEPENDENCY CHECK ==="
          safety check -r requirements.txt --json > reports/safety-report.json || true
          safety check -r requirements.txt || true
        continue-on-error: true

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          retention-days: 30

  # ============================================
  # STAGE 2: CODE QUALITY & LINTING
  # ============================================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Run Flake8 (Linting)
        run: |
          flake8 src/ --max-line-length=120 --ignore=E501,W503
        continue-on-error: true

      - name: Run Tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml || echo "No tests found"
        continue-on-error: true

  # ============================================
  # STAGE 3: BUILD & CONTAINER SECURITY
  # ============================================
  build-and-scan:
    name: Build & Container Scan
    runs-on: ubuntu-latest
    needs: [security-scan, lint-and-test]
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .
          docker tag ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
                     ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      # --- Trivy: Container Vulnerability Scan ---
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Run Trivy (Table Output)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} || true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      # --- Grype: Additional Container Scan ---
      - name: Run Grype Container Scan
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            --output json > grype-report.json || true
          grype ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} || true
        continue-on-error: true

      - name: Push to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Upload Container Scan Reports
        uses: actions/upload-artifact@v4
        with:
          name: container-security-reports
          path: |
            trivy-results.sarif
            grype-report.json
          retention-days: 30

  # ============================================
  # STAGE 4: ML MODEL TRAINING & VALIDATION
  # ============================================
  train-model:
    name: Train & Validate Model
    runs-on: ubuntu-latest
    needs: build-and-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare data
        run: python src/data_prep.py

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: file:mlruns
        run: python src/train.py

      - name: Upload model artifacts to S3
        run: |
          aws s3 cp models/best_model.pkl s3://${{ env.S3_BUCKET }}/models/best_model.pkl
          aws s3 cp models/feature_order.json s3://${{ env.S3_BUCKET }}/models/feature_order.json

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: mlruns/
          retention-days: 30

  # ============================================
  # STAGE 5: DEPLOY TO EKS WITH SECURITY POLICIES
  # ============================================
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [build-and-scan, train-model]
    if: github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          # Update image tag in deployment
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g" k8s/base/deployment.yaml
          sed -i "s|ECR_REGISTRY|${{ steps.login-ecr.outputs.registry }}|g" k8s/base/deployment.yaml

          # Apply Kubernetes manifests
          kubectl apply -f k8s/base/namespace.yaml
          kubectl apply -f k8s/base/

          # Wait for rollout
          kubectl rollout status deployment/housing-api -n devsecops-mlops --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n devsecops-mlops
          kubectl get services -n devsecops-mlops

  # ============================================
  # STAGE 6: SECURITY POLICY ENFORCEMENT (OPA)
  # ============================================
  policy-check:
    name: OPA Policy Check
    runs-on: ubuntu-latest
    needs: build-and-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/v0.61.0/opa_linux_amd64_static
          chmod 755 opa
          sudo mv opa /usr/local/bin/

      - name: Run OPA Policy Checks
        run: |
          echo "=== OPA SECURITY POLICY CHECKS ==="
          # Check Kubernetes manifests against security policies
          opa eval --data security/policies/ --input k8s/base/deployment.yaml \
            "data.kubernetes.deny" --format pretty || true
        continue-on-error: true

  # ============================================
  # STAGE 7: GENERATE SECURITY REPORT
  # ============================================
  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [security-scan, build-and-scan, policy-check]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports/

      - name: Generate Summary Report
        run: |
          echo "# DevSecOps Security Report" > security-summary.md
          echo "## Pipeline Run: ${{ github.run_id }}" >> security-summary.md
          echo "## Commit: ${{ github.sha }}" >> security-summary.md
          echo "## Date: $(date)" >> security-summary.md
          echo "" >> security-summary.md
          echo "### Scan Results" >> security-summary.md
          echo "- Code Security (Bandit): Check artifacts" >> security-summary.md
          echo "- Dependency Scan (pip-audit): Check artifacts" >> security-summary.md
          echo "- Container Scan (Trivy): Check artifacts" >> security-summary.md
          echo "- Policy Check (OPA): Check artifacts" >> security-summary.md
          cat security-summary.md

      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: final-security-report
          path: security-summary.md
          retention-days: 90
