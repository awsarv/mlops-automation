apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraud-api-sa
  namespace: devsecops-mlops
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::760829799650:role/fraud-api-s3-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fraud-api-role
  namespace: devsecops-mlops
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fraud-api-rolebinding
  namespace: devsecops-mlops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fraud-api-role
subjects:
  - kind: ServiceAccount
    name: fraud-api-sa
    namespace: devsecops-mlops
