apiVersion: v1
kind: Service
metadata:
  name: fraud-api
  namespace: devsecops-mlops
  labels:
    app: fraud-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: fraud-api
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-api-metrics
  namespace: devsecops-mlops
  labels:
    app: fraud-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: metrics
  selector:
    app: fraud-api
