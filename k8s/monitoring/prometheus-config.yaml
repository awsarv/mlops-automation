apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Kubernetes API server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # Kubernetes nodes
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # Kubernetes pods with prometheus.io annotations
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # Fraud Detection API
      - job_name: 'fraud-api'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - devsecops-mlops
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: fraud-api
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "8000"

  alerts.yml: |
    groups:
      - name: fraud-detection-alerts
        rules:
          - alert: HighFraudErrorRate
            expr: rate(fraud_predictions_total{status="error"}[5m]) > 0.1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: High error rate in fraud predictions
              description: Error rate is above 10% for the last 5 minutes

          - alert: HighFraudDetectionLatency
            expr: histogram_quantile(0.95, rate(fraud_inference_latency_seconds_bucket[5m])) > 0.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: High fraud detection latency
              description: 95th percentile latency is above 500ms

          - alert: HighFraudRate
            expr: rate(fraud_transactions_flagged_total[1h]) / rate(fraud_predictions_total[1h]) > 0.1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Unusually high fraud rate detected
              description: Fraud rate is above 10% for the last 15 minutes

          - alert: FraudAPIPodNotReady
            expr: kube_pod_status_ready{namespace="devsecops-mlops", condition="true"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Fraud API pod not ready
              description: Pod {{ $labels.pod }} has been not ready for 5 minutes
